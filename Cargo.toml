[package]
name = "rootguard"
version = "0.1.0"
edition = "2024"
description = "Failure intelligence: find root causes, verify fixes, prevent recurrence"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
regex = "1"

[dev-dependencies]
serde_yaml = "0.9"

[profile.release]
lto = true
strip = true
